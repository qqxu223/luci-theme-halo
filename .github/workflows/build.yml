name: build

# 同一份源码、两个 SDK：24.10 出 ipk（opkg），25.12 出 apk（apk-tools）。
# 包格式由 SDK 决定，主题本身不需要任何改动。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: luci-theme-halo (${{ matrix.release }} → ${{ matrix.ext }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '24.10.8'   # opkg 时代，最后一条 24.10 线
            ext: ipk
          - release: '25.12.6'   # apk 时代，当前 stable
            ext: apk
    steps:
      - uses: actions/checkout@v4

      - name: 安装宿主依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zstd rsync gawk unzip file

      # SDK 必须解压到工作区之外：仓库根就是包目录，SDK 落在里面会被 rsync 复制进自己。
      # 路径在本步内用 RUNNER_TEMP 拼，不放进 job env（那里不允许引用 runner context）。
      - name: 下载 OpenWrt SDK
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/sdk"
          base="https://downloads.openwrt.org/releases/${{ matrix.release }}/targets/x86/64"
          # 文件名里带 gcc 版本（24.10 是 13.3.0，25.12 是 14.3.0），写死会随小版本失效，现场解析
          file=$(curl -fsSL "$base/" \
                 | grep -oE 'openwrt-sdk-[0-9A-Za-z._-]*Linux-x86_64\.tar\.zst' \
                 | head -n1)
          echo "SDK = $file"
          test -n "$file"
          curl -fsSL -o /tmp/sdk.tar.zst "$base/$file"
          mkdir -p "$sdk"
          tar --zstd -xf /tmp/sdk.tar.zst -C "$sdk" --strip-components=1
          rm -f /tmp/sdk.tar.zst
          ls "$sdk" | head

      - name: 放入包源码
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/sdk/package/luci-theme-halo"
          mkdir -p "$dest"
          # 仓库根就是包目录；目录名决定 LUCI_NAME / PKG_NAME，必须叫 luci-theme-halo
          rsync -a --exclude '.git' --exclude '.github' --exclude 'preview' ./ "$dest/"
          # Windows 上提交会丢可执行位，这里兜一道：uci-defaults 不执行 = 主题不注册
          chmod +x "$dest"/root/etc/uci-defaults/* || true
          find "$dest" -type f -name '*.ut' -exec chmod 0644 {} +
          echo "--- package tree ---"
          find "$dest" -type f | sort

      - name: 更新 feeds
        working-directory: ${{ runner.temp }}/sdk
        run: |
          set -euo pipefail
          # 必须全量。ucode / rpcd / cgi-io / libubox / libusb / liblua 这些
          # luci-base 的依赖全在 packages feed 里；只拉 luci 的话它们全是
          # "does not exist"，依赖树解析不出来，最后卡在 lucihttp 的 lua.h。
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 编译
        working-directory: ${{ runner.temp }}/sdk
        run: |
          set -euo pipefail
          # 先把自己写进 .config 再 defconfig：这样 defconfig 会顺着
          # luci-theme-halo → luci-base → lucihttp → liblua 把整条依赖树选中。
          # 不做这步，直接 defconfig 编出来的 staging 里没有 lua.h，lucihttp 编译必挂。
          echo "CONFIG_PACKAGE_luci-theme-halo=y" >> .config
          make defconfig
          grep -E 'CONFIG_PACKAGE_luci-(base|theme-halo)|CONFIG_PACKAGE_liblua' .config || true
          make package/luci-theme-halo/compile V=s -j"$(nproc)"

      - name: 收集产物
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/sdk"
          mkdir -p out
          find "$sdk/bin/packages" -type f -name 'luci-theme-halo*' \
            \( -name '*.ipk' -o -name '*.apk' \) -exec cp -v {} out/ \;
          echo "---- out ----"
          ls -lh out
          test "$(ls out | wc -l)" -gt 0

      - uses: actions/upload-artifact@v4
        with:
          name: luci-theme-halo-${{ matrix.ext }}
          path: out/*
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          # body 会被 prepend 到自动生成的 changelog 前面（GitHub API 的行为）
          generate_release_notes: true
          body: |
            ## 安装

            OpenWrt 25.12 及以上（apk）：
            ```sh
            apk add --allow-untrusted ./luci-theme-halo-1.0.0-r1.apk
            ```

            OpenWrt 24.10（opkg）：
            ```sh
            opkg install ./luci-theme-halo_1.0.0-r1_all.ipk
            ```

            装完到 **系统 → 语言和界面 → 主题** 选 `Halo`。包只注册、不强制切换，卸载也不影响当前界面。

            ## 说明

            - 概览页是一块真仪表盘：网络信息、拓扑图、5 分钟双向吞吐曲线、系统状态，外加客户端 / 接口 / 流量大户
            - 采集层有单飞锁、逐调用超时、在途上限、失败退避、双时钟；标签页隐藏时零请求
            - 窄屏 < 620px 拓扑自动切成竖向链路，字号 1:1 不做缩放
            - 包为 `_all` 架构，依赖只有 `luci-base`，静态资源全部自带，不与其它主题共享文件
